[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "cordless"
version = "1.5.0"
description = "Serverless Discord interactions framework for AWS Lambda"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["discord", "bot", "lambda", "serverless", "aws", "interactions"]
dependencies = [
  "boto3>=1.20",
  "botocore[crt]",
  "pynacl>=1.5",
  "uv>=0.11",
]

authors = [
  { name = "borhara" }
]

classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]


[project.urls]
Homepage = "https://cordless.dev"
Documentation = "https://www.cordless.dev/guides/introduction/"
Repository = "https://github.com/borhara/cordless"


[project.scripts]
cordless = "cordless.cli:main"


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "boto3>=1.20",
    "boto3-stubs[apigatewayv2,dynamodb,events,iam,lambda,logs,sts]",
    "botocore[crt]",
    "moto[iam,awslambda-simple,apigatewayv2,events,logs,s3]>=5.0",
    "pynacl>=1.5",
    "pyright>=1.1",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.15.20",
]

[tool.pyright]
include = ["src/cordless", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
extraPaths = ["tests/fixtures"]
reportTypedDictNotRequiredAccess = false

[[tool.pyright.executionEnvironments]]
root = "tests"
reportMissingParameterType = false
reportUnknownParameterType = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportMissingTypeStubs = false
reportPrivateUsage = false
reportUnusedFunction = false
reportUnusedVariable = false
reportUntypedFunctionDecorator = false
reportUntypedNamedTuple = false
reportConstantRedefinition = false
reportUnnecessaryComparison = false
reportUnnecessaryIsInstance = false
reportUnnecessaryContains = false

[[tool.pyright.executionEnvironments]]
root = "src"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]  # pycodestyle, pyflakes, isort

[tool.ruff.lint.per-file-ignores]
# these carry markdown reference tables in docstrings (rendered into
# cordless.dev's api reference) - a table row can't wrap without breaking
# as markdown, so line-length doesn't apply the same way it does to code
"src/cordless/app.py" = ["E501"]
"src/cordless/context.py" = ["E501"]
# the resource modules import these model classes, so the reverse edge (model
# action methods calling resource functions) sits at end of file, after the
# class bodies, to keep the import from being circular
"src/cordless/models.py" = ["E402"]
"src/cordless/_rest/models.py" = ["E402"]